name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tabletopcafe
          POSTGRES_USER: tabletopcafe
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://tabletopcafe:ci_password@localhost:5432/tabletopcafe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run migrations
        run: npm run db:migrate
      - name: Seed database
        run: npm run db:seed
      - name: Start server
        run: NITRO_HOST=0.0.0.0 NITRO_PORT=3000 node .output/server/index.mjs > /tmp/server.log 2>&1 &
      - name: Wait for server
        run: |
          sleep 3
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /tmp/health_body.txt -w "%{http_code}" http://localhost:3000/api/health || echo "000")
            echo "Attempt $i: HTTP $STATUS — $(cat /tmp/health_body.txt 2>/dev/null)"
            if [ "$STATUS" = "200" ]; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "=== Server log ==="
          cat /tmp/server.log
          exit 1
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000
