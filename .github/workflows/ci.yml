name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tabletopcafe
          POSTGRES_USER: tabletopcafe
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://tabletopcafe:ci_password@localhost:5432/tabletopcafe
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci_admin_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run migrations
        run: npm run db:migrate
      - name: Seed database
        run: npm run db:seed
      - name: Seed admin user
        run: npm run db:seed-admin
      - name: Start server
        run: NITRO_HOST=0.0.0.0 NITRO_PORT=3000 node .output/server/index.mjs > /tmp/server.log 2>&1 &
        env:
          SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      - name: Wait for server
        run: |
          sleep 3
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /tmp/health_body.txt -w "%{http_code}" http://localhost:3000/api/health || echo "000")
            echo "Attempt $i: HTTP $STATUS — $(cat /tmp/health_body.txt 2>/dev/null)"
            if [ "$STATUS" = "200" ]; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "=== Server log ==="
          cat /tmp/server.log
          exit 1
      - name: Check games API
        run: |
          echo "=== /api/games ==="
          curl -s http://localhost:3000/api/games | head -c 500
          echo ""
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ci_admin_password
      - name: Dump server log on failure
        if: failure()
        run: cat /tmp/server.log || echo "(no server log)"

  bump-build-number:
    name: Bump build number
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Increment BUILD_NUMBER and push
        run: |
          number=$(cat BUILD_NUMBER)
          next=$((number + 1))
          echo $next > BUILD_NUMBER
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_NUMBER
          git commit -m "chore: bump build number to $next [skip ci]"
          git push origin main
